[highlight]
  style = "monokai"
  lineNos = true
  lineNumbersInTable = true

[tableOfContents]
  startLevel = 2
  endLevel = 3

[goldmark]
  [goldmark.renderer]
    unsafe = true
  [goldmark.extensions.passthrough]
    enable = true
    [goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]
