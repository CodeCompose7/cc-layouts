{{ define "main" }}
<div class="section" style="text-align:center; padding: 120px 24px 80px;">
  <h1>404</h1>
  <p style="color:var(--color-text-secondary); margin-top:16px;">
    {{ if eq .Lang "ko" }}페이지를 찾을 수 없습니다.{{ else }}Page not found.{{ end }}
  </p>
  <a href="{{ "" | relLangURL }}" class="btn btn-primary" style="margin-top:32px;">
    {{ if eq .Lang "ko" }}홈으로{{ else }}Go Home{{ end }}
  </a>
</div>
{{ end }}
