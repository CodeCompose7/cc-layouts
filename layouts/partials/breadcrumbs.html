<nav class="breadcrumbs" aria-label="Breadcrumb">
  <a href="{{ "" | relLangURL }}">{{ i18n "breadcrumb_home" }}</a>
  {{- range .Ancestors.Reverse }}
    {{- if not .IsHome }}
      <span class="separator">/</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- end }}
  {{- end }}
  <span class="separator">/</span>
  <span>{{ .Title }}</span>
</nav>
