{{ define "main" }}
<div class="section">
  <header class="single-header">
    <h1 class="single-title">{{ .Title }}</h1>
  </header>
  <div class="taxonomy-grid" style="margin-top:24px;">
    {{- range .Pages }}
      <a href="{{ .RelPermalink }}" class="taxonomy-item">
        <span>{{ .Title }}</span>
        <span class="taxonomy-item-count">{{ len .Pages }}</span>
      </a>
    {{- end }}
  </div>
</div>
{{ end }}
