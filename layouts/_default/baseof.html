<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  {{ if .Params.math }}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }] })"></script>
  {{ end }}

  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Site.Params.og_image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
  <meta property="og:site_name" content="{{ .Site.Title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Site.Params.og_image }}<meta name="twitter:image" content="{{ . | absURL }}">{{ end }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.article-card .tag-list, .course-card .tag-list').forEach(function (list) {
        var pills = Array.from(list.querySelectorAll('.tag-pill'));
        if (pills.length === 0) return;

        var firstTop = pills[0].offsetTop;
        var row2MaxTop = firstTop + pills[0].offsetHeight + 6;

        // 3번째 줄 이상의 pill 찾기
        var overflowStart = pills.findIndex(function (p) {
          return p.offsetTop > row2MaxTop + 2;
        });
        if (overflowStart === -1) return;

        for (var j = overflowStart; j < pills.length; j++) {
          pills[j].style.display = 'none';
        }

        var ellipsis = document.createElement('span');
        ellipsis.className = 'tag-pill';
        ellipsis.textContent = '···';
        ellipsis.style.cursor = 'default';
        list.appendChild(ellipsis);

        // ···이 3번째 줄로 밀리면 2번째 줄 마지막 pill도 숨김
        while (ellipsis.offsetTop > row2MaxTop + 2 && overflowStart > 0) {
          overflowStart--;
          pills[overflowStart].style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
